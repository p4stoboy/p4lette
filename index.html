<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="P4LETTE — drag, lock, shuffle, share. A small opinionated colour palette tool with named hues, harmony pickers, and exportable templates."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="P4LETTE" />
    <meta
      property="og:description"
      content="Drag, lock, shuffle, share. A small opinionated colour palette tool."
    />
    <meta property="og:url" content="https://p4lette.app" />
    <meta property="og:image" content="https://p4lette.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="P4LETTE shown in two skins — a poster-style swatch grid above a terminal-style monospace grid."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="P4LETTE" />
    <meta
      name="twitter:description"
      content="Drag, lock, shuffle, share. A small opinionated colour palette tool."
    />
    <meta name="twitter:image" content="https://p4lette.app/og.png" />

    <meta
      name="theme-color"
      content="#FFF8E7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E0B08"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      @keyframes p4l-marquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-12.5%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .p4l-marquee {
          animation: none !important;
        }
      }
    </style>
    <title>P4LETTE</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
